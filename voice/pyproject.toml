[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-voice"
version = "0.1.0"
description = "Pi capture, wake detection, and Studio voice transport"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "websockets>=14.2,<16",
  "orion-rustpotter",
]

[project.scripts]
orion-listener = "orion_voice.satellite:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["orion_voice*"]

[tool.uv.sources]
orion-rustpotter = { path = "rustpotter_native", editable = true }
