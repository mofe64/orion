[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-voice"
version = "0.1.0"
description = "Local speech workers for the Orion robot"
requires-python = ">=3.11,<3.12"
dependencies = [
  # Nano support landed after the latest PyPI package was published. Pin the
  # official source revision that introduced the Nano loader so Pi installs
  # cannot silently resolve to the older Turbo-only API.
  "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox.git@5de7a54aa4e5e2baadb0182dde554908b48b85c2",
]

[project.scripts]
orion-voice = "orion_voice.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["orion_voice*"]
