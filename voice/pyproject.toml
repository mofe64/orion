[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-voice"
version = "0.1.0"
description = "Local speech workers for the Orion robot"
requires-python = ">=3.11,<3.12"
dependencies = [
  # sherpa-onnx exposes sherpa-onnx-cli through Click but does not declare it.
  "click>=8.1,<9",
  "numpy>=1.26,<3",
  "piper-tts==1.7.0",
  # Sherpa imports both helpers unconditionally in its text2token utility.
  "pypinyin>=0.55,<1",
  "sentencepiece>=0.2,<0.3",
  "sherpa-onnx==1.13.6",
  "sherpa-onnx-bin==1.13.6",
]

[project.scripts]
orion-voice = "orion_voice.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["orion_voice*"]
