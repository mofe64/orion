format_version: 1

motion:
  name: look_at_left_expressive
  description: Notice, lean toward, and settle on the predefined left target.
  keyframes:
    - pose: look_left_anticipation
      duration: 1.20
      hold: 0.20
    - pose: look_left_lean
      duration: 0.80
      hold: 0.15
    - pose: look_left_overshoot
      duration: 1.00
      hold: 0.15
    - pose: look_left
      duration: 0.70
      hold: 0.80
