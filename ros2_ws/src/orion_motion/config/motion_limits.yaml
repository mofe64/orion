format_version: 2

units:
  position: radians
  velocity: radians_per_second
  acceleration: radians_per_second_squared
  jerk: radians_per_second_cubed

# These operational limits are deliberately conservative development
# thresholds for Gazebo and MuJoCo. They are not validated hardware limits.
applicability: provisional_simulation_only

source:
  mechanical_position:
    package: orion_description
    path: urdf/orion.urdf
  operational_dynamics:
    method: conservative_initial_thresholds
    evidence: pending_milestone_3_simulator_sweeps

# Array-based consumers, such as trajectory controllers, must use this order.
joint_order:
  - base_yaw_joint
  - shoulder_pitch_joint
  - elbow_pitch_joint
  - head_roll_joint
  - head_pitch_joint

# Motion generation currently assumes a stopped start. A moving-state blend is
# a later feature and must not be approximated by discarding measured velocity.
start_state:
  max_abs_velocity: 0.05

joints:
  base_yaw_joint:
    mechanical_position:
      lower: -5.02103
      upper: 1.26215
    operational_position:
      lower: -5.02103
      upper: 1.26215
    max_velocity: 1.5
    max_acceleration: 8.0
    max_jerk: 80.0
    max_cancel_deceleration: 4.0

  shoulder_pitch_joint:
    mechanical_position:
      lower: -1.33456
      upper: 2.05734
    operational_position:
      lower: -1.30388
      upper: 2.05734
    max_velocity: 1.5
    max_acceleration: 8.0
    max_jerk: 80.0
    max_cancel_deceleration: 4.0

  elbow_pitch_joint:
    mechanical_position:
      lower: -2.82002
      upper: 0.321569
    operational_position:
      lower: -2.82002
      upper: 0.321569
    max_velocity: 1.5
    max_acceleration: 8.0
    max_jerk: 80.0
    max_cancel_deceleration: 4.0

  head_roll_joint:
    mechanical_position:
      lower: -3.78654
      upper: 2.49665
    operational_position:
      lower: -3.78654
      upper: 2.49665
    max_velocity: 1.5
    max_acceleration: 8.0
    max_jerk: 80.0
    max_cancel_deceleration: 4.0

  head_pitch_joint:
    mechanical_position:
      lower: -0.853337
      upper: 2.28826
    operational_position:
      lower: -0.853337
      upper: 2.28826
    max_velocity: 1.5
    max_acceleration: 8.0
    max_jerk: 80.0
    max_cancel_deceleration: 4.0
