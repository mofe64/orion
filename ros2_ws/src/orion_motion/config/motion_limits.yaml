format_version: 1
units: radians
limit_kind: mechanical_position

source:
  package: orion_description
  path: urdf/orion.urdf

# Array-based consumers, such as trajectory controllers, must use this order.
joint_order:
  - base_yaw_joint
  - shoulder_pitch_joint
  - elbow_pitch_joint
  - head_roll_joint
  - head_pitch_joint

# These are the mechanical position limits from the URDF. They are not yet
# evidence-based operational safety limits.
joints:
  base_yaw_joint:
    lower: -5.02103
    upper: 1.26215
  shoulder_pitch_joint:
    lower: -1.08426
    upper: 2.05734
  elbow_pitch_joint:
    lower: -2.82002
    upper: 0.321569
  head_roll_joint:
    lower: -3.78654
    upper: 2.49665
  head_pitch_joint:
    lower: -0.853337
    upper: 2.28826
