format_version: 2

units:
  position: radians
  velocity: radians_per_second
  acceleration: radians_per_second_squared
  jerk: radians_per_second_cubed

# Position bounds mirror Orion's accepted physical calibration. Dynamic limits
# remain provisional simulator-development thresholds.
applicability: provisional_simulation_only

source:
  mechanical_position:
    package: orion_simulation
    path: simulation/mujoco/config/servo_calibration.json
    captured_at: "2026-08-29T07:53:33.644820+00:00"
  operational_dynamics:
    method: conservative_initial_thresholds
    evidence: pending_milestone_3_simulator_sweeps

# Array-based consumers, such as trajectory controllers, must use this order.
joint_order:
  - base_yaw_joint
  - shoulder_pitch_joint
  - elbow_pitch_joint
  - head_roll_joint
  - head_pitch_joint

# Motion generation currently assumes a stopped start. A moving-state blend is
# a later feature and must not be approximated by discarding measured velocity.
start_state:
  max_abs_velocity: 0.05

