format_version: 1
applicability: provisional_simulation_only

# Fresh measured-state and ROS trajectory-controller thresholds.
max_state_age: 0.25
path_position_tolerance: 0.20
goal_position_tolerance: 0.05
stopped_velocity_tolerance: 0.05
goal_time_tolerance: 0.50

# A successful action result is followed by fresh joint-state measurements.
# The final pose must stay inside both limits for this full duration.
goal_settle_duration: 0.25
goal_settle_timeout: 2.00

# Controller time follows simulation time, while the client must retain a
# finite wall-clock escape when Gazebo runs slower than real time or pauses.
result_timeout_factor: 5.00
result_timeout_margin: 1.00
cancel_response_timeout: 1.00
stop_confirmation_timeout: 2.00
stop_confirmation_duration: 0.20
