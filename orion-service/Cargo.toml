[package]
name = "orion-service"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[[bin]]
name = "orion-service"
path = "src/main.rs"

[dependencies]
orion-agent = { path = "../agent" }
orion-coordinator = { path = "../coordinator" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }

# Explicit native backends: no plaintext file or mock-store fallback on desktop.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
tempfile = "3"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = "0.28"
