[package]
name = "orion-studio"
version = "0.1.0"
description = "Cross-platform scene authoring and robot control for Orion"
authors = ["Orion contributors"]
edition = "2024"
license = "GPL-3.0-only"

[lib]
name = "orion_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
url = "2"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }

# Explicit native backends: no plaintext file or mock-store fallback on desktop.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }
