[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "orion-studio-voice-worker"
version = "0.1.0"
description = "Persistent local voice inference worker for Orion Studio"
requires-python = ">=3.10,<3.14"
dependencies = [
  "huggingface-hub>=0.36,<2",
  "numpy>=1.26,<3",
  "openai-codex>=0.147,<0.148",
  "orion-rustpotter",
  "websockets>=14.2,<16",
  "mlx-audio>=0.5.1,<0.6; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-qwen3-asr>=0.3.5,<0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
orion-rustpotter = { path = "rustpotter_native", editable = true }

[project.scripts]
orion-voice-models = "orion_voice_worker.models:main"

[tool.hatch.build.targets.wheel]
packages = ["orion_voice_worker"]
