format_version: 1
margin_degrees: 3
minimum_head_travel_mm: 20
rest_margin_exempt: true
poses:
  home: home
  home_low: down
  home_attentive: up
  home_window: redistribute
  rest: rest
  attentive: up
  delight: up
  lean_reach_low: down
  lean_reach_left: down
  lean_reach_right: down
  look_left: up
  look_left_anticipation: redistribute
  look_left_lean: up
  look_left_overshoot: up
  attention_left: up
  attention_left_anticipation: redistribute
  attention_left_lean: up
  attention_left_overshoot: up
  look_right: up
  look_right_anticipation: redistribute
  look_right_lean: up
  look_right_overshoot: up
  attention_right: up
  attention_right_anticipation: redistribute
  attention_right_lean: up
  attention_right_overshoot: up
motions:
  arrival_notice:
    intent: Raise and turn the head first, then rise into the attentive posture and return.
    direction: up
    main_keyframe: 1
    contexts:
    - start: home
      anchor: home
    source: 'runtime/src/expression/reactions.rs and runtime/src/control/aim_light.rs: active anchor with
      the command-time planner'
    planner: arrival
  attention_left:
    intent: A small grounded turn toward the confirmed speaker on the left.
