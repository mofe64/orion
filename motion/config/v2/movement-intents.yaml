    main_keyframe: 1
    contexts:
    - start: home
      anchor: home
    source: 'runtime/src/expression/reactions.rs and runtime/src/control/aim_light.rs: active anchor with
      the command-time planner'
    planner: arrival
  attention_left:
    intent: A small grounded turn toward the confirmed speaker on the left.
