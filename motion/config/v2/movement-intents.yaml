  home_low: down
  home_attentive: up
  home_window: redistribute
  rest: rest
  attentive: up
  delight: up
  lean_reach_low: down
  lean_reach_left: down
  lean_reach_right: down
  look_left: up
  look_left_anticipation: redistribute
  look_left_lean: up
  look_left_overshoot: up
  attention_left: up
  attention_left_anticipation: redistribute
  attention_left_lean: up
  attention_left_overshoot: up
  look_right: up
  look_right_anticipation: redistribute
  look_right_lean: up
  look_right_overshoot: up
  attention_right: up
  attention_right_anticipation: redistribute
  attention_right_lean: up
  attention_right_overshoot: up
