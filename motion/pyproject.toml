[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-motion"
version = "0.1.0"
description = "Backend-independent Orion motion definitions and validation"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[tool.pytest.ini_options]
testpaths = ["test"]
