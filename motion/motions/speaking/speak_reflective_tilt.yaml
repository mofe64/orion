format_version: 2
motion:
  name: speak_reflective_tilt
  description: Reflective head tilt with intentional stillness on return.
  space: anchor_relative
  style: speaking_calm
  return_to_anchor: true
  keyframes:
    - offsets: {head_roll_joint: 0.14, head_pitch_joint: 0.06, shoulder_pitch_joint: -0.05}
      duration: 0.52
      arrival: through
      marker: reflection
    - offsets: {head_roll_joint: 0.06, head_pitch_joint: -0.03, shoulder_pitch_joint: 0.02}
      duration: 0.48
      arrival: through
    - offsets: {}
      duration: 0.66
      arrival: settle
