format_version: 2
motion:
  name: idle_head_curiosity
  description: Gentle pitch and roll examination around the anchor.
  space: anchor_relative
  style: living_idle
  return_to_anchor: true
  keyframes:
    - offsets: {head_roll_joint: 0.035, head_pitch_joint: 0.022}
      duration: 0.75
      arrival: through
    - offsets: {head_roll_joint: 0.018, head_pitch_joint: -0.012}
      duration: 0.65
      arrival: through
    - offsets: {}
      duration: 0.85
      arrival: settle
