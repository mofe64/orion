format_version: 2
motion:
  name: idle_attentive_hold
  description: Subtle upward movement for attentive anchors.
  space: anchor_relative
  style: attentive
  return_to_anchor: true
  keyframes:
    - offsets: {shoulder_pitch_joint: 0.020, head_pitch_joint: 0.025, elbow_pitch_joint: -0.014}
      duration: 0.75
      arrival: through
    - offsets: {head_roll_joint: 0.018, head_pitch_joint: 0.012}
      duration: 0.65
      arrival: through
    - offsets: {}
      duration: 0.85
      arrival: settle
