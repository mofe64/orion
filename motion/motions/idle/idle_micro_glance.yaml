format_version: 2
motion:
  name: idle_micro_glance
  description: Two-degree base and head glance with a full return.
  space: anchor_relative
  style: living_idle
  return_to_anchor: true
  keyframes:
    - offsets: {base_yaw_joint: 0.040, head_roll_joint: -0.022}
      duration: 0.65
      arrival: through
    - offsets: {base_yaw_joint: 0.025, head_roll_joint: -0.012}
      duration: 0.55
      arrival: through
    - offsets: {}
      duration: 0.75
      arrival: settle
