format_version: 2
motion:
  name: idle_breathe
  description: Visible coordinated rise and weighted return.
  space: anchor_relative
  style: living_idle
  return_to_anchor: true
  keyframes:
    - offsets: {shoulder_pitch_joint: 0.055, elbow_pitch_joint: -0.065, head_pitch_joint: 0.040}
      duration: 1.3
      arrival: through
    - offsets: {shoulder_pitch_joint: 0.025, elbow_pitch_joint: -0.030, head_pitch_joint: 0.018}
      duration: 0.9
      arrival: through
    - offsets: {}
      duration: 1.2
      arrival: settle
