format_version: 2
motion:
  name: speak_react_surprised
  description: Pull the arm back and raise the head for a surprised pause.
  space: anchor_relative
  style: attentive
  return_to_anchor: true
  keyframes:
  - offsets:
      head_pitch_joint: -0.22
      shoulder_pitch_joint: -0.12
      elbow_pitch_joint: -0.02
    duration: 0.2
    arrival: settle
    hold: 0.25
    marker: surprised
  - offsets: {}
    duration: 0.45
    arrival: settle
