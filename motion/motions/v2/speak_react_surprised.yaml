format_version: 2
motion:
  name: speak_react_surprised
  description: A quick pull back and lift used as a spoken surprised reaction.
  space: anchor_relative
  style: attentive
  return_to_anchor: true
  keyframes:
    - offsets: {head_pitch_joint: 0.24, shoulder_pitch_joint: -0.10, elbow_pitch_joint: 0.08}
      duration: 0.20
      arrival: settle
      hold: 0.25
      marker: surprised
    - offsets: {}
      duration: 0.45
      arrival: settle
