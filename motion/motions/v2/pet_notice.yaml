format_version: 2
motion:
  name: pet_notice
  description: Lift into delight, follow the pet briefly, and return to the held anchor.
  space: anchor_relative
  style: speaking_calm
  return_to_anchor: true
  keyframes:
  - offsets:
      shoulder_pitch_joint: 0.005
      elbow_pitch_joint: 0.003
    duration: 0.3
    arrival: settle
    marker: compression
  - offsets:
      shoulder_pitch_joint: -0.08
      elbow_pitch_joint: -0.04
      head_pitch_joint: -0.2
    duration: 0.8
    arrival: settle
    marker: delight
  - offsets:
      shoulder_pitch_joint: -0.08
      elbow_pitch_joint: -0.04
      head_pitch_joint: -0.2
      head_roll_joint: 0.06
    duration: 0.25
    arrival: settle
    marker: pet_head
  - offsets:
      shoulder_pitch_joint: -0.08
      elbow_pitch_joint: -0.04
      head_pitch_joint: -0.2
      head_roll_joint: 0.06
    duration: 0.35
    arrival: settle
    hold: 3.0
    marker: pet_track
  - offsets: {}
    duration: 3.0
    arrival: settle
