  description: Raise the head slowly, lift the arm with it, and settle back.
  space: anchor_relative
  style: living_idle
  return_to_anchor: true
  keyframes:
  - offsets:
      head_pitch_joint: -0.2094
      shoulder_pitch_joint: -0.0414
      elbow_pitch_joint: -0.1457
    duration: 1.1639
    arrival: through
  - offsets:
      head_pitch_joint: -0.0838
      shoulder_pitch_joint: -0.0176
      elbow_pitch_joint: -0.0583
    duration: 0.9783
    arrival: through
  - offsets: {}
    duration: 1.2578
    arrival: settle
