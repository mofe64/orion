format_version: 2
motion:
  name: idle_breathe
  description: Raise the head slowly, breathe through the arm, and settle back.
  space: anchor_relative
  style: living_idle
  return_to_anchor: true
  keyframes:
  - offsets:
      head_pitch_joint: -0.025132741228718346
    duration: 0.0656
    arrival: through
    marker: idle_head_start
  - offsets:
      head_pitch_joint: -0.20943951023931956
      shoulder_pitch_joint: -0.01
      elbow_pitch_joint: -0.02
    duration: 1.6
    arrival: through
  - offsets:
      head_pitch_joint: -0.08377580409572782
      shoulder_pitch_joint: -0.005
      elbow_pitch_joint: -0.008
    duration: 1.4
    arrival: through
  - offsets: {}
    duration: 1.8
    arrival: settle
