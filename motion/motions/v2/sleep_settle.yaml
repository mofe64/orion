format_version: 2
motion:
  name: sleep_settle
  description: Sink the head and arm slowly, then return.
  space: anchor_relative
  style: living_idle
  return_to_anchor: true
  keyframes:
  - offsets:
      shoulder_pitch_joint: -0.025
      elbow_pitch_joint: 0.005
      head_pitch_joint: 0.08
    duration: 1.5
    arrival: settle
    marker: sleep_settle
    hold: 0.25
  - offsets: {}
    duration: 1.1
    arrival: settle
