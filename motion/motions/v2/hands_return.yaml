format_version: 2
motion:
  name: hands_return
  description: Slow arm-led desk transition with anticipation and a held destination anchor.
  space: anchor_relative
  style: speaking_calm
  return_to_anchor: true
  keyframes:
    - offsets: {shoulder_pitch_joint: -0.02, elbow_pitch_joint: 0.005}
      duration: 0.45
      arrival: settle
      marker: anticipation
    - offsets: {shoulder_pitch_joint: -0.01, elbow_pitch_joint: 0.0025}
      duration: 0.8
      arrival: settle
      marker: arm_lead
    - offsets: {}
      duration: 2.5
      arrival: settle
      hold: 0.2
