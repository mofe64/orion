format_version: 2
motion:
  name: think_beat_b
  description: Lower the head and sink a little in thought, hold, and return.
  space: anchor_relative
  style: thinking
  return_to_anchor: true
  keyframes:
  - offsets:
      head_pitch_joint: 0.38
      shoulder_pitch_joint: -0.1
      elbow_pitch_joint: 0.2
      head_roll_joint: -0.14
    duration: 0.8
    arrival: settle
    hold: 0.5
    marker: think_settle
  - offsets: {}
    duration: 0.9
    arrival: settle
