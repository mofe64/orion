format_version: 2
motion:
  name: speak_react_laugh
  description: Make three raised head bounces with a light arm lift.
  space: anchor_relative
  style: attentive
  return_to_anchor: true
  keyframes:
  - offsets:
      head_pitch_joint: -0.18
      shoulder_pitch_joint: -0.04
      elbow_pitch_joint: -0.02
    duration: 0.17
    arrival: through
    marker: laugh
  - offsets:
      head_pitch_joint: -0.05
      shoulder_pitch_joint: -0.015
    duration: 0.15
    arrival: through
  - offsets:
      head_pitch_joint: -0.17
      shoulder_pitch_joint: -0.04
      elbow_pitch_joint: -0.02
    duration: 0.15
    arrival: through
  - offsets:
      head_pitch_joint: -0.05
      shoulder_pitch_joint: -0.01
    duration: 0.15
    arrival: through
  - offsets:
      head_pitch_joint: -0.15
      shoulder_pitch_joint: -0.03
      elbow_pitch_joint: -0.015
    duration: 0.15
    arrival: through
  - offsets: {}
    duration: 0.3
    arrival: settle
