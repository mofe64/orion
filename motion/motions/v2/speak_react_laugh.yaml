format_version: 2
motion:
  name: speak_react_laugh
  description: Make three raised head bounces with the arm bouncing along.
  space: anchor_relative
  style: attentive
  return_to_anchor: true
  keyframes:
  - offsets:
      head_pitch_joint: -0.18
      shoulder_pitch_joint: -0.067
      elbow_pitch_joint: -0.128
    duration: 0.17
    arrival: through
    marker: laugh
  - offsets:
      head_pitch_joint: -0.05
      shoulder_pitch_joint: -0.0225
      elbow_pitch_joint: -0.03
    duration: 0.15
    arrival: through
  - offsets:
      head_pitch_joint: -0.17
      shoulder_pitch_joint: -0.0655
      elbow_pitch_joint: -0.122
    duration: 0.15
    arrival: through
  - offsets:
      head_pitch_joint: -0.05
      shoulder_pitch_joint: -0.0175
      elbow_pitch_joint: -0.03
    duration: 0.15
    arrival: through
  - offsets:
      head_pitch_joint: -0.15
      shoulder_pitch_joint: -0.0525
      elbow_pitch_joint: -0.105
    duration: 0.15
    arrival: through
  - offsets: {}
    duration: 0.3
    arrival: settle
