format_version: 2
motion:
  name: speak_react_laugh
  description: Three quick head bounces with a shoulder lift used as a spoken laugh reaction.
  space: anchor_relative
  style: attentive
  return_to_anchor: true
  keyframes:
    - offsets: {head_pitch_joint: 0.14, shoulder_pitch_joint: 0.05}
      duration: 0.16
      arrival: through
      marker: laugh
    - offsets: {head_pitch_joint: 0.04, shoulder_pitch_joint: 0.03}
      duration: 0.14
      arrival: through
    - offsets: {head_pitch_joint: 0.12, shoulder_pitch_joint: 0.05}
      duration: 0.14
      arrival: through
    - offsets: {head_pitch_joint: 0.04, shoulder_pitch_joint: 0.02}
      duration: 0.14
      arrival: through
    - offsets: {head_pitch_joint: 0.09, shoulder_pitch_joint: 0.03}
      duration: 0.14
      arrival: through
    - offsets: {}
      duration: 0.30
      arrival: settle
