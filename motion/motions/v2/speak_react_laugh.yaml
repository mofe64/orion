format_version: 2
motion:
  name: speak_react_laugh
  description: Three quick head bounces with a shoulder lift used as a spoken laugh reaction.
  space: anchor_relative
  style: attentive
  return_to_anchor: true
  keyframes:
    - offsets: {head_pitch_joint: 0.20, shoulder_pitch_joint: 0.08}
      duration: 0.17
      arrival: through
      marker: laugh
    - offsets: {head_pitch_joint: 0.06, shoulder_pitch_joint: 0.04}
      duration: 0.15
      arrival: through
    - offsets: {head_pitch_joint: 0.18, shoulder_pitch_joint: 0.08}
      duration: 0.15
      arrival: through
    - offsets: {head_pitch_joint: 0.06, shoulder_pitch_joint: 0.03}
      duration: 0.15
      arrival: through
    - offsets: {head_pitch_joint: 0.14, shoulder_pitch_joint: 0.05}
      duration: 0.15
      arrival: through
    - offsets: {}
      duration: 0.30
      arrival: settle
