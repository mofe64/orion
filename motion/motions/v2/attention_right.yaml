format_version: 2
motion:
  name: attention_right
  description: A small grounded turn toward the confirmed speaker on the right.
  space: absolute
  style: expressive_turn
  keyframes:
  - pose: attention_right_anticipation
    duration: 0.65
    arrival: through
  - pose: attention_right_lean
    duration: 1.1
    arrival: through
    marker: notice
  - pose: attention_right_overshoot
    duration: 0.8
    arrival: through
  - pose: attention_right
    duration: 1.0
    arrival: settle
    marker: settled
