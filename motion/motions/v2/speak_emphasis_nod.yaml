format_version: 2
motion:
  name: speak_emphasis_nod
  description: Nod down at a phrase boundary, lift back, and settle at the anchor.
  space: anchor_relative
  style: speaking_emphatic
  return_to_anchor: true
  keyframes:
  - offsets:
      head_pitch_joint: 0.20943951023931956
      shoulder_pitch_joint: -0.01
    duration: 0.22
    arrival: through
    marker: emphasis
  - offsets:
      head_pitch_joint: -0.03490658503988659
      elbow_pitch_joint: 0.01
    duration: 0.25
    arrival: through
  - offsets: {}
    duration: 0.32
    arrival: settle
