format_version: 2
motion:
  name: speak_emphasis_nod
  description: Phrase-boundary nod for energetic speech peaks.
  space: anchor_relative
  style: speaking_emphatic
  return_to_anchor: true
  keyframes:
    - offsets: {head_pitch_joint: 0.18, shoulder_pitch_joint: -0.05}
      duration: 0.22
      arrival: through
      marker: emphasis
    - offsets: {head_pitch_joint: -0.07, elbow_pitch_joint: 0.045}
      duration: 0.25
      arrival: through
    - offsets: {}
      duration: 0.32
      arrival: settle
