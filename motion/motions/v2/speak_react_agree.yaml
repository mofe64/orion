format_version: 2
motion:
  name: speak_react_agree
  description: A clear double nod used as a spoken agreement reaction.
  space: anchor_relative
  style: attentive
  return_to_anchor: true
  keyframes:
    - offsets: {head_pitch_joint: 0.17, shoulder_pitch_joint: -0.03}
      duration: 0.26
      arrival: through
      marker: agree
    - offsets: {head_pitch_joint: -0.03}
      duration: 0.22
      arrival: through
    - offsets: {head_pitch_joint: 0.12}
      duration: 0.22
      arrival: through
    - offsets: {}
      duration: 0.30
      arrival: settle
