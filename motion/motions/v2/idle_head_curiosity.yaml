format_version: 2
motion:
  name: idle_head_curiosity
  description: Raise the gaze and turn the neck slowly to inspect the surroundings, with a small arm lift.
  space: anchor_relative
  style: living_idle
  return_to_anchor: true
  keyframes:
  - offsets:
      head_roll_joint: 0.2094
      head_pitch_joint: -0.14
      elbow_pitch_joint: -0.084
      shoulder_pitch_joint: -0.0838
    duration: 0.75
    arrival: through
  - offsets:
      head_roll_joint: 0.0838
      head_pitch_joint: -0.06
      elbow_pitch_joint: -0.036
      shoulder_pitch_joint: -0.0341
    duration: 0.65
    arrival: through
  - offsets: {}
    duration: 0.85
    arrival: settle
