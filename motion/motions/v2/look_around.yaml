format_version: 2
motion:
  name: look_around
  description: Deliberate three-stop desk search, neck leading the base, then returning to its anchor.
  space: anchor_relative
  style: speaking_calm
  return_to_anchor: true
  keyframes:
    - offsets: {head_roll_joint: 0.025, head_pitch_joint: -0.02}
      duration: 0.35
      arrival: through
    - offsets: {head_roll_joint: -0.12, head_pitch_joint: 0.18}
      duration: 0.65
      arrival: through
    - offsets: {base_yaw_joint: -0.35, head_roll_joint: -0.05, head_pitch_joint: 0.18}
      duration: 1.6
      arrival: settle
      hold: 0.4
      marker: search_left
    - offsets: {base_yaw_joint: -0.35, head_roll_joint: 0.12, head_pitch_joint: 0.18}
      duration: 0.65
      arrival: through
    - offsets: {head_pitch_joint: 0.18}
      duration: 1.6
      arrival: settle
      hold: 0.4
      marker: search_centre
    - offsets: {head_roll_joint: 0.12, head_pitch_joint: 0.18}
      duration: 0.65
      arrival: through
    - offsets: {base_yaw_joint: 0.35, head_roll_joint: 0.05, head_pitch_joint: 0.18}
      duration: 1.6
      arrival: settle
      hold: 0.4
      marker: search_right
    - offsets: {}
      duration: 2.8
      arrival: settle
