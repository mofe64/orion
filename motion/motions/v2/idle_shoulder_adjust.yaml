format_version: 2
motion:
  name: idle_shoulder_adjust
  description: Redistribute the shoulder and elbow slowly, then return.
  space: anchor_relative
  style: living_idle
  return_to_anchor: true
  keyframes:
  - offsets:
      shoulder_pitch_joint: -0.20943951023931956
      elbow_pitch_joint: 0.1
      head_pitch_joint: 0.03
    duration: 1.6
    arrival: through
  - offsets:
      shoulder_pitch_joint: -0.08377580409572782
      elbow_pitch_joint: 0.04
      head_pitch_joint: 0.01
    duration: 1.4
    arrival: through
  - offsets: {}
    duration: 1.8
    arrival: settle
