format_version: 2
motion:
  name: think_beat_a
  description: Glance up and aside to think, hold, and return.
  space: anchor_relative
  style: thinking
  return_to_anchor: true
  keyframes:
  - offsets:
      head_roll_joint: 0.44
      head_pitch_joint: -0.28
      base_yaw_joint: 0.06
      shoulder_pitch_joint: -0.06
    duration: 0.8
    arrival: settle
    hold: 0.5
    marker: think_glance
  - offsets: {}
    duration: 0.9
    arrival: settle
