format_version: 2

motion:
  name: look_at_left_expressive
  description: Notice, lean toward, and settle on the predefined left target.
  space: absolute
  style: expressive_turn
  keyframes:
    - pose: look_left_anticipation
      duration: 0.25
      arrival: through
    - pose: look_left_lean
      duration: 0.40
      arrival: through
      marker: notice
    - pose: look_left_overshoot
      duration: 0.30
      arrival: through
    - pose: look_left
      duration: 0.35
      arrival: settle
      marker: settled
