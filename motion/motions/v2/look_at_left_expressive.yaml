format_version: 2
motion:
  name: look_at_left_expressive
  description: Notice, lean toward, and settle on the predefined left target.
  space: absolute
  style: expressive_turn
  keyframes:
  - pose: look_left_anticipation
    duration: 0.65
    arrival: through
  - pose: look_left_lean
    duration: 1.1
    arrival: through
    marker: notice
  - pose: look_left_overshoot
    duration: 0.8
    arrival: through
  - pose: look_left
    duration: 1.0
    arrival: settle
    marker: settled
