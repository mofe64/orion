format_version: 2
motion:
  name: mutual_gaze_notice_demo
  description: Meet the look with a clear nod, turn the neck with curiosity, and return.
  space: anchor_relative
  style: attentive
  return_to_anchor: true
  keyframes:
  - offsets:
      head_pitch_joint: -0.2
    duration: 0.35
    arrival: settle
    hold: 0.1
    marker: meet
  - offsets:
      head_pitch_joint: -0.06
    duration: 0.25
    arrival: through
    marker: nod
  - offsets:
      head_pitch_joint: -0.2
    duration: 0.25
    arrival: settle
  - offsets:
      head_pitch_joint: -0.2
      head_roll_joint: 0.26
    duration: 0.6
    arrival: settle
    hold: 2.0
    marker: curious
  - offsets: {}
    duration: 0.9
    arrival: settle
