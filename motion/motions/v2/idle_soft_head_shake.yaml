format_version: 2
motion:
  name: idle_soft_head_shake
  description: Restrained asymmetric head shake and settle.
  space: anchor_relative
  style: living_idle
  return_to_anchor: true
  keyframes:
    - offsets: {base_yaw_joint: -0.10, head_roll_joint: 0.070}
      duration: 0.5
      arrival: through
    - offsets: {base_yaw_joint: 0.13, head_roll_joint: -0.060}
      duration: 0.55
      arrival: through
    - offsets: {base_yaw_joint: -0.040, head_roll_joint: 0.020}
      duration: 0.45
      arrival: through
    - offsets: {}
      duration: 0.65
      arrival: settle
