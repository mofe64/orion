format_version: 2
motion:
  name: idle_micro_glance
  description: Turn the base slowly for a brief glance while the arm eases back, with a full return.
  space: anchor_relative
  style: living_idle
  return_to_anchor: true
  keyframes:
  - offsets:
      base_yaw_joint: 0.2094
      head_roll_joint: -0.07
      shoulder_pitch_joint: -0.0838
    duration: 0.65
    arrival: settle
    hold: 0.75
    marker: glance_fixation
  - offsets:
      base_yaw_joint: 0.0838
      head_roll_joint: -0.03
      shoulder_pitch_joint: -0.0341
    duration: 0.55
    arrival: through
  - offsets: {}
    duration: 0.75
    arrival: settle
