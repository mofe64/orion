format_version: 2
motion:
  name: idle_micro_glance
  description: Turn the base slowly for a brief glance with a full return.
  space: anchor_relative
  style: living_idle
  return_to_anchor: true
  keyframes:
  - offsets:
      base_yaw_joint: 0.20943951023931956
      head_roll_joint: -0.07
    duration: 0.65
    arrival: settle
    hold: 0.75
    marker: glance_fixation
  - offsets:
      base_yaw_joint: 0.08377580409572782
      head_roll_joint: -0.03
    duration: 0.55
    arrival: through
  - offsets: {}
    duration: 0.75
    arrival: settle
