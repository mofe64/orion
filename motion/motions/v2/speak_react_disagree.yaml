format_version: 2
motion:
  name: speak_react_disagree
  description: A clear three-beat head shake led by the neck, with the base following.
  space: anchor_relative
  style: attentive
  return_to_anchor: true
  keyframes:
  - offsets:
      head_roll_joint: -0.28
      base_yaw_joint: -0.1
    duration: 0.24
    arrival: through
    marker: disagree
  - offsets:
      head_roll_joint: 0.28
      base_yaw_joint: 0.1
    duration: 0.28
    arrival: through
  - offsets:
      head_roll_joint: -0.16
      base_yaw_joint: -0.05
    duration: 0.24
    arrival: through
  - offsets: {}
    duration: 0.28
    arrival: settle
