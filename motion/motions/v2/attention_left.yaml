format_version: 2
motion:
  name: attention_left
  description: A small grounded turn toward the confirmed speaker on the left.
  space: absolute
  style: expressive_turn
  keyframes:
    - pose: attention_left_anticipation
      duration: 0.22
      arrival: through
    - pose: attention_left_lean
      duration: 0.42
      arrival: through
      marker: notice
    - pose: attention_left_overshoot
      duration: 0.28
      arrival: through
    - pose: attention_left
      duration: 0.38
      arrival: settle
      marker: settled
