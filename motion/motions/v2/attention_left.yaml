format_version: 2
motion:
  name: attention_left
  description: A small grounded turn toward the confirmed speaker on the left.
  space: absolute
  style: expressive_turn
  keyframes:
  - pose: attention_left_anticipation
    duration: 0.65
    arrival: through
  - pose: attention_left_lean
    duration: 1.1
    arrival: through
    marker: notice
  - pose: attention_left_overshoot
    duration: 0.8
    arrival: through
  - pose: attention_left
    duration: 1.0
    arrival: settle
    marker: settled
