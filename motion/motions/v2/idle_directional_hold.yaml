format_version: 2
motion:
  name: idle_directional_hold
  description: Raise the gaze and lift the arm slowly while holding a directional or desk anchor.
  space: anchor_relative
  style: living_idle
  return_to_anchor: true
  keyframes:
  - offsets:
      head_pitch_joint: -0.2094
      shoulder_pitch_joint: -0.0414
      elbow_pitch_joint: -0.1407
    duration: 0.7531
    arrival: through
  - offsets:
      head_roll_joint: 0.04
      head_pitch_joint: -0.0838
      elbow_pitch_joint: -0.0503
      shoulder_pitch_joint: -0.0246
    duration: 0.633
    arrival: through
  - offsets: {}
    duration: 0.8139
    arrival: settle
