format_version: 2
motion:
  name: idle_directional_hold
  description: Readable pose-compatible detail while holding left or right.
  space: anchor_relative
  style: living_idle
  return_to_anchor: true
  keyframes:
    - offsets: {head_pitch_joint: 0.008400}
      duration: 0.0656
      arrival: through
      marker: idle_head_start
    - offsets: {head_pitch_joint: 0.070, shoulder_pitch_joint: -0.050}
      duration: 0.6344
      arrival: through
    - offsets: {head_roll_joint: 0.060, elbow_pitch_joint: 0.050, head_pitch_joint: 0.025}
      duration: 0.65
      arrival: through
    - offsets: {}
      duration: 0.85
      arrival: settle
