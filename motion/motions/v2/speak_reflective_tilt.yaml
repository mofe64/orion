format_version: 2
motion:
  name: speak_reflective_tilt
  description: Turn the neck aside, lower the gaze and ease back, then return quietly.
  space: anchor_relative
  style: speaking_calm
  return_to_anchor: true
  keyframes:
  - offsets:
      head_roll_joint: 0.26
      head_pitch_joint: 0.18
      shoulder_pitch_joint: -0.08
      elbow_pitch_joint: 0.06
    duration: 0.52
    arrival: through
    marker: reflection
  - offsets:
      head_roll_joint: 0.12
      head_pitch_joint: 0.08
      shoulder_pitch_joint: -0.03
      elbow_pitch_joint: 0.02
    duration: 0.48
    arrival: through
  - offsets: {}
    duration: 0.66
    arrival: settle
