format_version: 2
motion:
  name: speak_reflective_tilt
  description: Turn the neck aside and lower the gaze, then return quietly.
  space: anchor_relative
  style: speaking_calm
  return_to_anchor: true
  keyframes:
  - offsets:
      head_roll_joint: 0.14
      head_pitch_joint: 0.1
      shoulder_pitch_joint: -0.03
    duration: 0.52
    arrival: through
    marker: reflection
  - offsets:
      head_roll_joint: 0.06
      head_pitch_joint: 0.04
      shoulder_pitch_joint: -0.01
    duration: 0.48
    arrival: through
  - offsets: {}
    duration: 0.66
    arrival: settle
