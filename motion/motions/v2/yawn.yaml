format_version: 2
motion:
  name: yawn
  description: Dip, rise tall with the head up, hold, then sink back.
  space: anchor_relative
  style: living_idle
  return_to_anchor: true
  keyframes:
  - offsets:
      head_pitch_joint: 0.06
      elbow_pitch_joint: 0.04
    duration: 0.35
    arrival: through
  - offsets:
      head_pitch_joint: -0.32
      elbow_pitch_joint: -0.26
      shoulder_pitch_joint: -0.06
    duration: 1.2
    arrival: settle
    hold: 0.7
    marker: yawn
  - offsets:
      head_pitch_joint: 0.1
      elbow_pitch_joint: 0.06
      shoulder_pitch_joint: -0.02
    duration: 1.2
    arrival: through
  - offsets: {}
    duration: 0.7
    arrival: settle
