format_version: 2
motion:
  name: yawn
  description: Raise the head, hold briefly, then sink back.
  space: anchor_relative
  style: living_idle
  return_to_anchor: true
  keyframes:
  - offsets:
      head_pitch_joint: -0.12
      shoulder_pitch_joint: -0.02
    duration: 1.3
    arrival: settle
    marker: yawn
    hold: 0.6
  - offsets: {}
    duration: 1.8
    arrival: settle
