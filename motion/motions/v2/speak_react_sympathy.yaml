format_version: 2
motion:
  name: speak_react_sympathy
  description: Lower the head and turn the neck softly for sympathy.
  space: anchor_relative
  style: attentive
  return_to_anchor: true
  keyframes:
  - offsets:
      head_pitch_joint: 0.2
      head_roll_joint: 0.11
      shoulder_pitch_joint: 0.04
      elbow_pitch_joint: 0.025
    duration: 0.5
    arrival: settle
    hold: 0.25
    marker: sympathy
  - offsets: {}
    duration: 0.5
    arrival: settle
