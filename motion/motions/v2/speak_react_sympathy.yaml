format_version: 2
motion:
  name: speak_react_sympathy
  description: A slow droop with a soft tilt used as a spoken sympathy reaction.
  space: anchor_relative
  style: attentive
  return_to_anchor: true
  keyframes:
    - offsets: {head_pitch_joint: -0.20, head_roll_joint: 0.11, shoulder_pitch_joint: -0.06, elbow_pitch_joint: 0.04}
      duration: 0.50
      arrival: settle
      hold: 0.25
      marker: sympathy
    - offsets: {}
      duration: 0.50
      arrival: settle
