format_version: 2
motion:
  name: speak_react_sympathy
  description: Sink with the head down, the arm lowered and a soft turn, hold, and rise.
  space: anchor_relative
  style: attentive
  return_to_anchor: true
  keyframes:
  - offsets:
      shoulder_pitch_joint: 0.06
      elbow_pitch_joint: 0.22
      head_pitch_joint: 0.22
      head_roll_joint: 0.12
    duration: 0.55
    arrival: settle
    marker: sympathy
    hold: 0.25
  - offsets: {}
    duration: 0.5
    arrival: settle
