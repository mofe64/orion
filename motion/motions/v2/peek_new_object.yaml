format_version: 2
motion:
  name: peek_new_object
  description: Arm-led desk peek with a curious neck turn and a full anchor return.
  space: anchor_relative
  style: speaking_calm
  return_to_anchor: true
  keyframes:
    - offsets: {shoulder_pitch_joint: -0.03, elbow_pitch_joint: 0.005}
      duration: 0.35
      arrival: settle
      marker: pullback
    - offsets: {shoulder_pitch_joint: 0.20, elbow_pitch_joint: -0.035}
      duration: 0.65
      arrival: settle
      marker: arm_lead
    - offsets: {shoulder_pitch_joint: 0.60, elbow_pitch_joint: -0.10, head_pitch_joint: 0.25}
      duration: 2.5
      arrival: settle
      hold: 0.4
      marker: reach
    - offsets: {shoulder_pitch_joint: 0.60, elbow_pitch_joint: -0.10, head_pitch_joint: 0.25, head_roll_joint: 0.06}
      duration: 0.55
      arrival: settle
      hold: 0.45
      marker: curious
    - offsets: {}
      duration: 3.0
      arrival: settle
