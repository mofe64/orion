format_version: 2
motion:
  name: wake_stretch
  description: Dip, stretch tall with the head up, shake out, and settle.
  space: anchor_relative
  style: living_idle
  return_to_anchor: true
  keyframes:
  - offsets:
      head_pitch_joint: 0.1
    duration: 0.45
    arrival: through
  - offsets:
      shoulder_pitch_joint: -0.04
      elbow_pitch_joint: -0.46
      head_pitch_joint: -0.14
    duration: 1.2
    arrival: settle
    marker: wake_stretch
    hold: 0.6
  - offsets:
      shoulder_pitch_joint: -0.04
      elbow_pitch_joint: -0.4
      head_pitch_joint: -0.1
      head_roll_joint: 0.16
    duration: 0.3
    arrival: through
  - offsets:
      shoulder_pitch_joint: -0.04
      elbow_pitch_joint: -0.4
      head_pitch_joint: -0.1
      head_roll_joint: -0.16
    duration: 0.35
    arrival: through
  - offsets:
      head_pitch_joint: 0.04
    duration: 1.0
    arrival: through
  - offsets: {}
    duration: 0.5
    arrival: settle
