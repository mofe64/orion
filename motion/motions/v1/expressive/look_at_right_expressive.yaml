format_version: 2

motion:
  name: look_at_right_expressive
  description: Notice, lean toward, and settle on the predefined right target.
  space: absolute
  style: expressive_turn
  keyframes:
    - pose: look_right_anticipation
      duration: 0.25
      arrival: through
    - pose: look_right_lean
      duration: 0.40
      arrival: through
      marker: notice
    - pose: look_right_overshoot
      duration: 0.30
      arrival: through
    - pose: look_right
      duration: 0.35
      arrival: settle
      marker: settled
