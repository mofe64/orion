[package]
name = "orion-runtime"
version = "0.1.0"
edition = "2024"
autobins = false
description = "Orion's native motion and servo runtime"
license = "GPL-3.0-only"

[lib]
name = "orion_runtime"
path = "src/lib.rs"


[[bin]]
name = "oriond"
path = "src/main.rs"

[[bin]]
name = "orion-trajectory"
path = "src/bin/orion-trajectory.rs"

[dependencies]
libc = "0.2"
orion-history = { path = "../history" }
serde = {version = "1",features = ["derive"]}
serde_json = "1"
serde_yaml = "0.9"
rustypot = "=1.6.0"
serialport = {version = "4", default-features = false}
signal-hook = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
roxmltree = "=0.21.1"

[dev-dependencies]
tempfile = "3"
