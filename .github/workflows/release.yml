name: Raspberry Pi release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Test release tag, e.g. v0.1.0-test.1'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}
      - name: Select version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "ORION_VERSION=${INPUT_VERSION:-$GITHUB_REF_NAME}" >> "$GITHUB_ENV"
      - name: Check pinned Raspberry Pi packages
        run: python3 scripts/native_packages.py --check-archives
      - name: Build and validate in ARM64 Debian containers
        run: scripts/build_release.sh "$ORION_VERSION"
      - name: Attach release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$ORION_VERSION" >/dev/null 2>&1; then
            args=()
            if [[ $ORION_VERSION == *-* ]]; then args+=(--prerelease); fi
            gh release create "$ORION_VERSION" --title "Orion $ORION_VERSION" --generate-notes "${args[@]}"
          fi
          gh release upload "$ORION_VERSION" artifacts/orion-*-arm64.tar.gz artifacts/orion-*-arm64.tar.gz.sha256 --clobber
