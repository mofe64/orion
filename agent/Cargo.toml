[package]
name = "orion-agent"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Orion conversation runtime, independent of voice inference and Tauri"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "sync", "time"] }
