[package]
name = "orion-history"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "File-based Orion conversations and behaviour journal"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
