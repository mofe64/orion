# DKMS rebuilds Orion's RP1 NeoPixel PWM driver for every kernel the package
# manager installs. install-persistent.sh copies this file beside the upstream
# rpi_ws281x pi5 driver source in /usr/src/rp1_ws281x_pwm-orion1/.
PACKAGE_NAME="rp1_ws281x_pwm"
PACKAGE_VERSION="orion1"
BUILT_MODULE_NAME[0]="rp1_ws281x_pwm"
DEST_MODULE_LOCATION[0]="/extra"
# The upstream Makefile defaults KPATH to the running kernel; DKMS may build for
# a newly installed kernel before it boots.
MAKE[0]="make KPATH=${kernel_source_dir}"
CLEAN="make KPATH=${kernel_source_dir} clean"
AUTOINSTALL="yes"
