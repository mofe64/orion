[build-system]
requires = ["setuptools>=71"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-servo-setup"
version = "0.1.0"
description = "STS3215 provisioning, verification, and calibration for Orion."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-only"
dependencies = [
    "lerobot[feetech]>=0.5.1,<0.7.0",
    "pyyaml>=6.0,<7.0",
]

[project.scripts]
orion-setup-servos = "orion_servo_setup.cli:main"
orion-verify-servos = "orion_servo_setup.verify_cli:main"
orion-calibrate-servos = "orion_servo_setup.calibrate_cli:main"
orion-accept-supported-rest = "orion_servo_setup.supported_rest_cli:main"
orion-capture-rest = "orion_servo_setup.rest_cli:main"
