# Orion owns ReSpeaker playback and capture directly through ALSA.
# Desktop profile probing otherwise resets PCM to -23.5 dB after boot.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-soc_107c000000_sound" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
