format_version: 1

scene:
  name: return_to_rest
  description: Return to the captured mechanical rest pose and fade the lights off.
  timeline:
    - at: 0.0
      type: goto_pose
      pose: rest
      duration_seconds: 3.0
    - at: 0.0
      type: light
      red: 0
      green: 0
      blue: 0
      white: 0
      transition_seconds: 0.50
