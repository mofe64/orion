[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "orion-speech-worker"
version = "0.1.0"
description = "Local speech inference worker for Orion"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "sherpa-onnx==1.13.8",
  "sherpa-onnx-core==1.13.8; sys_platform == 'linux'",
  "scipy>=1.17,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["orion_speech_worker"]
